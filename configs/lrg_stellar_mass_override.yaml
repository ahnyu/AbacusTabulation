# Simultaneous stellar-mass-split HOD fitting example.
# This inherits the same universal base as lrg_fit_override.yaml.
inherits: abacustabulation_base.yaml

sim_params:
  sim_dir: /cluster/path/to/AbacusSummit
  sim_name: AbacusSummit_base_c000_ph000
  z_mock: 0.800

prepare_profiles:
  out_dir: /cluster/path/prepared

paircounts:
  prepared_dir: /cluster/path/prepared
  output_dir: /cluster/path/paircounts
  file_tag: abacustab_profiles_conc-r98-L2com-over-r25-L2com

hmf:
  prepared_dir: /cluster/path/prepared
  output_dir: /cluster/path/hmf
  file_tag: abacustab_profiles_conc-r98-L2com-over-r25-L2com
  seed: 600
  n_bins: 512

hod:
  model: lrg_stellar_mass

  # raw: one edge array; relative: one edge-array row per redshift cell.
  # Omitted relative redshift_weights default to equal weights.
  # A final .inf includes every galaxy above the last finite boundary.
  stellar_mass:
    split_method: raw
    logmstar_edges: [10.4, 11.05, 11.30, 11.55, .inf]

  params:
    logMcut: 13.0
    sigma: 0.4
    logM1: 14.0
    kappa: 1.0
    alpha: 1.0
    a_c: 1.0

    logMstar_cen_bend: 11.2
    logMh_cen_bend: 13.5
    beta_cen_low: 0.5
    beta_cen_high: 0.2
    sigma_logMstar_cen: 0.18
    width_cen_bend: 0.8

    alpha_star_sat: -1.2
    delta_cs_pivot: 0.4
    delta_cs_gradient: 0.05
    logMh_delta_pivot: 14.0

derived:
  linear_bias:
    enabled: true
    paircounts_job: linear_bias
    fit_s_min: 10.0
    fit_s_max: 40.0

  tracers:
    LRG:
      hmf:
        path: null

fit:
  tracers: [LRG]

  # Observable order also defines the joint covariance block order.
  observables:
    - {tracer: LRG, sample: sm0, statistic: wp, slice: [0, 18]}
    - {tracer: LRG, sample: sm1, statistic: wp, slice: [0, 18]}
    - {tracer: LRG, sample: sm2, statistic: wp, slice: [0, 18]}
    - {tracer: LRG, sample: sm3, statistic: wp, slice: [0, 18]}

  data:
    tracers:
      LRG:
        # Clear scalar entries inherited from the universal base.
        wp: null
        xi02: null
        number_density: null
        samples:
          sm0:
            wp: {path: /cluster/path/data/lrg_sm0_wp.txt, column: 1}
            number_density: {value: 1.0e-4, mode: gaussian, error: 1.0e-5, source: hmf}
          sm1:
            wp: {path: /cluster/path/data/lrg_sm1_wp.txt, column: 1}
            number_density: {value: 1.0e-4, mode: gaussian, error: 1.0e-5, source: hmf}
          sm2:
            wp: {path: /cluster/path/data/lrg_sm2_wp.txt, column: 1}
            number_density: {value: 1.0e-4, mode: gaussian, error: 1.0e-5, source: hmf}
          sm3:
            wp: {path: /cluster/path/data/lrg_sm3_wp.txt, column: 1}
            number_density: {value: 1.0e-4, mode: gaussian, error: 1.0e-5, source: hmf}

  covariance:
    mode: joint
    joint:
      path: /cluster/path/data/lrg_stellar_mass_wp_joint_cov.txt

  theory:
    tracers:
      LRG:
        stellar_mass:
          samples:
            sm0: 0
            sm1: 1
            sm2: 2
            sm3: 3
        paircounts:
          rppi:
            path: null
          smu:
            path: null

  # Parent-HOD and stellar-mass-filter parameters are shared by every split.
  parameters:
    logMcut: {initial: 13.0, min: 12.0, max: 14.5}
    sigma: {initial: 0.4, min: 0.05, max: 1.5}
    logM1: {initial: 14.0, min: 12.5, max: 15.5}
    kappa: {initial: 1.0, min: 0.1, max: 3.0}
    alpha: {initial: 1.0, min: 0.2, max: 2.0}
    a_c: {initial: 1.0, min: 0.0, max: 1.0}
    logMstar_cen_bend: {initial: 11.2, min: 10.5, max: 12.0}
    logMh_cen_bend: {initial: 13.5, min: 12.0, max: 15.0}
    beta_cen_low: {initial: 0.5, min: 0.0, max: 1.5}
    beta_cen_high: {initial: 0.2, min: -0.5, max: 1.0}
    sigma_logMstar_cen: {initial: 0.18, min: 0.05, max: 0.6}
    width_cen_bend: {initial: 0.8, min: 0.1, max: 2.0}
    alpha_star_sat: {initial: -1.2, min: -2.5, max: 3.0}
    delta_cs_pivot: {initial: 0.4, min: 0.0, max: 1.5}
    delta_cs_gradient: {initial: 0.05, min: -0.5, max: 0.5}

  output:
    output_dir: /cluster/path/fit_outputs/{sim_name}/{z}
    prefix: lrg_stellar_mass_wp

  postprocess:
    enabled: true
    optimization: true
    mcmc: true
    fail_on_error: false
