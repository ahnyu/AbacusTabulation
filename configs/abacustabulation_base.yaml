# Universal AbacusTabulation config.
# Both scripts accept this file through --path2config.

sim_params:
  sim_dir: /path/to/AbacusSummit
  sim_name: AbacusSummit_base_c000_ph000
  z_mock: 0.800
  cleaned_halos: true

prepare_profiles:
  # Plain roots expand to <root>/{sim_name}/{z}. Explicit templates still work.
  out_dir: /path/to/prepared
  seed: 600
  overwrite: false
  n_parallel: 1
  slab_indices: null   # null means discover all halo_info slabs; or use [0, 1, 2]

  # Positions written by the preparation step:
  # real: write real-space pos only
  # both: write real-space pos and RSD pos_rsd
  # rsd:  accepted as a shorthand for writing pos and pos_rsd; pos is still real-space
  position_space: real
  los_axis: z
  box_origin: center

  # NFW sample count rule: int(nfw_count_factor * N^2 + 1.5), then clipped.
  # null uses the built-in default: 2e-7, with the HugeBase scaling when relevant.
  nfw_count_factor: null
  min_particles_per_halo: 1
  max_particles_per_halo: null
  particle_chunk_size: 2000000

  # Satellite velocities only matter when position_space is rsd or both.
  satellite_velocity_model: gaussian

  # NFW profile concentration = numerator_key / denominator_key.
  # The NFW truncation radius remains r98_L2com.
  concentration_numerator_key: r98_L2com
  concentration_denominator_key: r25_L2com
  nfw_tolerance: 1.0e-5

  position_dtype: f4
  index_dtype: i4
  write_particle_radius: false
  hdf5_compression: null
  output_tag: abacustab_profiles

paircounts:
  # Plain roots expand to <root>/{sim_name}/{z}. Explicit templates still work.
  prepared_dir: /path/to/prepared
  output_dir: /path/to/paircounts
  overwrite: false

  # If null, the paircount loader infers the prepared file tag when only one tag
  # exists in prepared_dir. Set this when multiple concentration/profile runs share
  # the same directory.
  file_tag: null
  seed: 600
  nthreads: 32
  boxsize: null        # null reads Lbox from prepared-file attrs
  corrfunc_dtype: f4
  hdf5_compression: null

  mass:
    nmass_bins: 20
    # Halo-count subbins stored in paircount files for downstream HOD weighting.
    n_subbins: 20
    logm_min: null
    logm_max: null
    # Either null, a list of edges, or a path to a text file of log10 mass edges.
    logm_edges: null

  jobs:
    # Main tabulation used for clustering likelihoods and direct HOD clustering calls.
    clustering:
      enabled: true
      output_dir: null       # null -> paircounts.output_dir/{sim_name}/{z}/clustering
      position_dataset: pos  # use pos_rsd here after prepare_profiles.position_space: both
      clustering: [rppi, smu]

      rppi:
        rp_binning: log10    # log10 uses rp_min/rp_max as log10(Mpc/h); linear uses Mpc/h
        nrp_bins: 18
        rp_min: -1.5
        rp_max: 1.5
        pi_max: 40.0

      smu:
        s_binning: log10     # log10 uses s_min/s_max as log10(Mpc/h); linear uses Mpc/h
        ns_bins: 18
        s_min: -1.5
        s_max: 1.5
        mu_max: 1.0
        nmu_bins: 100

    # Real-space smu table used by derived linear-bias postprocessing.
    linear_bias:
      enabled: true
      output_dir: null       # null -> paircounts.output_dir/{sim_name}/{z}/linear_bias
      position_dataset: pos
      clustering: [smu]

      smu:
        s_binning: linear
        ns_bins: 30
        s_min: 5.0
        s_max: 80.0
        mu_max: 1.0
        nmu_bins: 100

# High-resolution HMF used for derived HOD quantities and optional fit number-density constraints.
hmf:
  # Plain roots expand to <root>/{sim_name}/{z}. Explicit templates still work.
  prepared_dir: /path/to/prepared
  output_dir: /path/to/hmf
  path: null          # exact HMF file path; if null infer from output_dir/file_tag/seed/n_bins
  file_tag: null
  seed: 600
  n_bins: 512
  logm_min: null
  logm_max: null
  logm_edges: null
  overwrite: false
  hdf5_compression: null

# Optional scalar HOD-derived quantities for fit-output postprocessing.
derived:
  quantities:
    - n_cen
    - n_sat
    - number_density
    - satellite_fraction
    - log10_mh_cen_med
    - log10_mh_sat_med
    - mh_cen_med
    - mh_sat_med
    - linear_bias

  linear_bias:
    enabled: true
    paircounts_job: linear_bias
    paircounts_path: null
    fit_s_min: 10.0
    fit_s_max: 40.0
    cosmology_index: null   # null infers c000 -> 0 from sim_params.sim_name
    z: null                 # null uses sim_params.z_mock
    engine: camb
    positive_only: true

  tracers:
    LRG:
      hmf:
        path: null

# Example HOD block for Python-side clustering calls.
# abacustabulation.galaxy_correlation_from_config(...) reads this block.
# HOD parameter names are canonical-only; aliases such as logM_cut or pmax are rejected.
hod:
  # Default model for direct clustering, fitting, and derived quantities.
  model: lrg
  params:
    logMcut: 13.0
    sigma: 0.4
    logM1: 14.0
    kappa: 1.0
    alpha: 1.0
    a_c: 1.0


# Optional fitting block for MCMC/optimization scripts.
# scripts/run_fit_optimize.py and scripts/run_fit_pocomc.py read this block.
fit:
  # Multi-tracer syntax is explicit, but current production path is single-tracer auto fitting.
  tracers: [LRG]

  # Order here defines the theory vector order and the joint covariance order.
  # Supported statistics are wp, xi0, and xi2.
  observables:
    - tracer: LRG
      statistic: wp
      slice: [0, 18]    # must not exceed paircounts.jobs.clustering.rppi.nrp_bins
    - tracer: LRG
      statistic: xi0
      slice: [0, 18]    # must not exceed paircounts.jobs.clustering.smu.ns_bins
    - tracer: LRG
      statistic: xi2
      slice: [0, 18]

  data:
    tracers:
      LRG:
        wp:
          path: /path/to/wp.txt
          column: 1

        # xi0 and xi2 are read from the same xi02 file when either statistic is requested.
        xi02:
          path: /path/to/xi02.txt
          xi0_column: 1
          xi2_column: 3

        # Number density is handled outside the clustering covariance.
        # source: hmf uses the high-resolution HMF; source: paircounts uses the clustering table bins.
        # mode: none disables this constraint.
        # mode: minimum rejects models below value.
        # mode: gaussian applies a one-sided Gaussian penalty below value.
        # mode: gaussian_two_sided applies a Gaussian penalty on either side.
        number_density:
          value: null
          mode: none
          source: hmf
          error: null

  covariance:
    mode: joint          # joint or block
    inversion: inv       # inv or pinv
    covariance_n_mocks: null
    precision_scale: 1.0

    # Used when mode: joint. Block order must match fit.observables exactly.
    joint:
      path: /path/to/joint_covariance.txt

    # Used when mode: block. Each block may be selected-size or full-size before slices.
    blocks:
      - observables: [wp]
        path: /path/to/wp_covariance.txt
      - observables: [xi0, xi2]
        path: /path/to/xi02_covariance.txt

  theory:
    tracers:
      LRG:
        # Optional hod_model here overrides hod.model for this tracer.
        fixed_params: {}
        paircounts:
          rppi:
            path: null   # null means infer from paircounts.jobs.clustering
          smu:
            path: null

  # Ordered free parameters with uniform top-hat priors.
  # Any HOD parameter not listed here is taken from hod.params and theory.tracers.<tracer>.fixed_params.
  # Multi-tracer fits require TRACER.param names unless the parameter sets shared: true.
  parameters:
    logMcut: {initial: 13.0, min: 12.0, max: 14.5}
    sigma:   {initial: 0.4,  min: 0.05, max: 1.5}
    logM1:   {initial: 14.0, min: 12.5, max: 15.5}
    kappa:   {initial: 1.0,  min: 0.1,  max: 3.0}
    alpha:   {initial: 1.0,  min: 0.2,  max: 2.0}
    a_c:     {initial: 1.0,  min: 0.0,  max: 1.5}

  # Optional hard ordering constraints. Each entry requires lower <= upper.
  parameter_constraints: []

  output:
    output_dir: /path/to/fit_outputs/{sim_name}/{z}
    prefix: lrg_tabulated

  postprocess:
    enabled: false
    optimization: true
    mcmc: true
    fail_on_error: false

  optimization:
    method: Nelder-Mead        # or L-BFGS-B, Powell, differential_evolution
    target: posterior          # posterior includes bounds; like maximizes likelihood only
    native_threads_per_process: 1
    multiprocessing_start_method: fork
    options:
      maxiter: 1000

  mcmc:
    pocomc:
      use_mpi: false
      n_processes: 1              # local multiprocessing workers when use_mpi is false
      native_threads_per_process: 1
      multiprocessing_start_method: fork
      resume_state_path: null
      sampler: {}
      run:
        n_total: 4096
        save_every: 5
